name: Android APK

# Bu makinede Flutter/Android SDK kurulu olmadığı için APK burada üretilir.
# İmza anahtarı secret olarak verilmişse release anahtarıyla, verilmemişse
# debug anahtarıyla imzalanır (telefona doğrudan kurmak için ikisi de yeterli).

on:
  workflow_dispatch:
    inputs:
      surum:
        description: >-
          kisisel: Gemini anahtarı gömülür, kurulur kurulmaz çalışır (yalnızca
          kendi telefonun için). paylasim: anahtar gömülmez, başkalarına
          verilebilir; kullanıcı Ayarlar'dan kendi anahtarını girer.
        type: choice
        options: [kisisel, paylasim]
        default: kisisel
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Drift kod üretimi
        run: dart run build_runner build

      - name: Testler
        run: flutter test

      - name: İmza anahtarı
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret yok — debug anahtarıyla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Gömülü anahtar APK'dan çıkarılabilir: paylaşılacak sürümde gömülmez.
      - name: APK derlemesi
        env:
          GEMINI_API_KEY: ${{ (github.event.inputs.surum || 'kisisel') == 'kisisel' && secrets.GEMINI_API_KEY || '' }}
        # --obfuscate: Dart kodu okunmaz hale gelir; çökme yığınlarını çözmek
        # için gereken semboller ayrı bir arşivde saklanır.
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk Paceora.apk

      # Play Store APK yerine Android App Bundle (AAB) ister.
      - name: AAB derlemesi (Play Store)
        env:
          GEMINI_API_KEY: ${{ (github.event.inputs.surum || 'kisisel') == 'kisisel' && secrets.GEMINI_API_KEY || '' }}
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
          cp build/app/outputs/bundle/release/app-release.aab Paceora.aab

      - uses: actions/upload-artifact@v7
        with:
          name: Paceora-apk
          path: Paceora.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Paceora-aab
          path: Paceora.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Paceora-semboller
          path: build/symbols
          if-no-files-found: warn
