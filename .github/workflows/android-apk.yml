name: Android APK

# Bu makinede Flutter/Android SDK kurulu olmadığı için APK burada üretilir.
# İmza anahtarı secret olarak verilmişse release anahtarıyla, verilmemişse
# debug anahtarıyla imzalanır (telefona doğrudan kurmak için ikisi de yeterli).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Drift kod üretimi
        run: dart run build_runner build

      - name: Testler
        run: flutter test

      - name: İmza anahtarı
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret yok — debug anahtarıyla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: APK derlemesi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk Paceora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Paceora-apk
          path: Paceora.apk
          if-no-files-found: error
